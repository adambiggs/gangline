name: shell

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Linux and macOS cover the GNU and BSD userlands Gangline supports.
# Release Please owns release PRs, tags, GitHub Releases, and declared version
# updates, but only after this same main-push run passes both verification jobs.

jobs:
  check:
    strategy:
      fail-fast: false   # a macOS flake must not hide a real linux failure
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Dependencies
        run: |
          set -eu
          have_all=yes
          for t in tmux shellcheck; do
            command -v "$t" >/dev/null || have_all=no
          done
          [ "$have_all" = no ] || exit 0
          case "${{ runner.os }}" in
            Linux) sudo apt-get install -y tmux shellcheck ;;
            macOS)
              # Keep BSD userland ahead of GNU coreutils in this cell.
              brew install tmux shellcheck
              ;;
            *) echo "no dependency recipe for runner.os=${{ runner.os }}" >&2; exit 1 ;;
          esac

      - name: Versions
        run: |
          set -euo pipefail

          interp="$(command -v bash)"
          echo "interpreter: $interp"
          "$interp" --version | head -1

          if [ "${{ runner.os }}" = macOS ]; then
            bv="$("$interp" -c 'printf "%s.%s" "${BASH_VERSINFO[0]}" "${BASH_VERSINFO[1]}"')"
            [ "$bv" = 3.2 ] || {
              echo "this cell resolves bash $bv, so the 3.2 parse it exists to run is not happening" >&2
              exit 1
            }
          fi

          tmux -V

          v="$(awk --version 2>/dev/null | head -1 || true)"
          [ -n "$v" ] || v="$(awk -W version 2>&1 | head -1 || true)"
          [ -n "$v" ] || v="$(awk 2>&1 | head -1 || true)"   # busybox names itself in usage
          [ -n "$v" ] || { echo "awk did not identify itself" >&2; exit 1; }
          echo "awk: $v"

      - name: Syntax and lint
        run: test/lint.sh

      - name: Fast smoke
        run: test/smoke.sh

  integration:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Dependencies
        run: |
          set -eu
          command -v tmux >/dev/null || sudo apt-get install -y tmux

      - name: Integration test
        # Measured 3m45s for integration.sh and 4m09s for the capped complete
        # gate on 2026-08-14. Fifteen minutes leaves at least 3x that observed
        # integration runtime so a slow runner fails by assertion, not truncation.
        timeout-minutes: 15
        run: test/integration.sh

  # THE WORLD THE RESOLVER GUARDS WERE WRITTEN FOR. Every hosted runner ships a
  # tmux that serializes a user option's control bytes into visible text, so the
  # two win_id diagnostics that sanitize a raw registration cannot be handed one
  # there: the regressions above still run and still pass, over an identity that
  # never carried the byte. A 3.2-era tmux hands it back raw. This cell builds
  # one and runs the same mandatory suite under it, which is the only routine
  # place those two branches are exercised against the thing they disarm.
  #
  # test/tmux-option-bytes.sh is the single definition of the question. The
  # suite reads it to decide whether to make the claim at all; this cell reads
  # it to refuse before spending fifteen minutes proving nothing.
  raw-option-bytes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # PINNED, NOT TRACKED. The value of this cell is a version proven to
      # round-trip the byte; a later release that stopped would retire the
      # coverage while the job kept going green. The probe refuses to guess, so
      # a bump that changes the answer fails here instead of going unnoticed.
      TMUX_RAW_VERSION: 3.2a
      TMUX_RAW_PREFIX: /home/runner/.local/tmux-raw
    steps:
      - uses: actions/checkout@v5

      - name: Cache tmux ${{ env.TMUX_RAW_VERSION }}
        id: tmux-raw
        uses: actions/cache@v4
        with:
          path: ${{ env.TMUX_RAW_PREFIX }}
          key: tmux-${{ env.TMUX_RAW_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Dependencies
        # Installed on a cache hit too: the cached tree is the tmux binary, not
        # the shared libraries it loads.
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y libevent-dev libncurses-dev bison pkg-config

      - name: Build tmux ${{ env.TMUX_RAW_VERSION }}
        if: steps.tmux-raw.outputs.cache-hit != 'true'
        run: |
          set -eu
          curl -fsSL -o /tmp/tmux-raw.tar.gz \
            "https://github.com/tmux/tmux/releases/download/$TMUX_RAW_VERSION/tmux-$TMUX_RAW_VERSION.tar.gz"
          tar -xzf /tmp/tmux-raw.tar.gz -C /tmp
          cd "/tmp/tmux-$TMUX_RAW_VERSION"
          ./configure --prefix="$TMUX_RAW_PREFIX"
          make -j"$(nproc)"
          make install

      - name: Raw user-option bytes
        run: |
          set -eu
          export PATH="$TMUX_RAW_PREFIX/bin:$PATH"
          tmux -V
          bytes="$(test/tmux-option-bytes.sh)"
          echo "user-option-control-bytes: $bytes"
          [ "$bytes" = raw ] || {
            echo "this cell exists to run the suite where a user option hands a control byte back raw, and this tmux answers '$bytes'; the resolver regressions it carries would pass here without ever holding the byte" >&2
            exit 1
          }

      - name: Integration test
        # The same ceiling as the hosted-tmux cell, for the same suite and the
        # same reason; the build above is cached and outside it.
        timeout-minutes: 15
        run: |
          set -eu
          export PATH="$TMUX_RAW_PREFIX/bin:$PATH"
          test/integration.sh

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # tag, and create the GitHub Release
      pull-requests: write   # maintain the release PR
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
