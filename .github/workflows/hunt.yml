name: hunt

on:
  pull_request:

permissions:
  contents: read

jobs:
  hunt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tmux
        run: |
          set -eu
          command -v tmux >/dev/null && { tmux -V; exit 0; }
          case "${{ runner.os }}" in
            Linux) sudo apt-get install -y tmux ;;
            macOS) brew install tmux ;;
          esac
          tmux -V
      - name: Environment
        run: |
          tmux -V; go version; command -v strace || true
          grep -E "^Sig" /proc/self/status || ps -o pid,blocked,pending -p $$
      - name: Darwin signal probe
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/diag"
          GANG_HUNT=1 go test -count=1 -v -timeout=600s -run TestHuntDarwinTokenSignalRace ./substrate/tmux 2>&1 | tee "$RUNNER_TEMP/diag/probe.txt"
      - name: Acquire-tree repeat
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/diag"
          go test -count=100 -timeout=900s -run 'TestAcquireTree' ./substrate/tmux 2>&1 | tee "$RUNNER_TEMP/diag/acquire.txt" | grep -E -- '--- FAIL|_test.go:[0-9]+:|^(ok|FAIL)'
      - name: Hunt
        run: |
          ci-hunt/watchdog.sh "$RUNNER_TEMP/diag/watch" &
          status=0
          ci-hunt/loop.sh "$RUNNER_TEMP/diag/tests" 1800 || status=$?
          if ls "$RUNNER_TEMP"/diag/watch/hang-*.txt; then status=1; fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/diag
          include-hidden-files: false
