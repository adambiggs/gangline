name: tmux floor

# Does the tmux version install.sh refuses to go below actually work? The floor is
# the one requirement gang states to users, and before this cell existed it was
# reasoning from source that nobody had ever run — which is how it came to refuse
# 2.6 and 3.0a, two versions that work (issues #25 and #31).
#
# The number is READ FROM install.sh, never written here. A constant in this file
# would be a fourth place to state the floor, and the reason this cell exists is
# that a floor stated in prose had never been executed.
#
# TWO INSTRUMENTS, AND THE FLOOR NEEDS BOTH. probe-paste-property.sh asks whether
# a paste arrives as a paste, which is the property install.sh used to name;
# probe-vocabulary.sh runs every tmux call bin/gang and the profiles actually make.
# A version that delivers pastes while failing a call gang makes is not a floor,
# and neither is the reverse.
#
# It asserts in BOTH directions, because a cell that only proves the floor works
# can never report that the floor is too high:
#
#   at the floor      both must hold          — otherwise we ship a promise we fail
#   below the floor   both must NOT hold      — otherwise the floor is stricter
#                                               than the evidence
#
# Either assertion may fail, and a failure below the floor is a finding rather
# than a fault: it is the cell inviting the number down. That invitation is the
# point of keeping the measurement separate from the decision — a floor moved by
# the same hand that measured it is not evidence, so this reports and a person
# decides.
#
# REPORT, NOT BLOCK. Exit codes, deliberately:
#
#   1  the enforced floor did not hold. Nothing else here can make that
#      acceptable, so this one stops a merge.
#   0  everything else, including "the floor is too high" and every
#      could-not-determine. A blocking cell that goes red for a finding teaches
#      people to bypass it. Could-not-determine is annotated as an error and still
#      exits 0: it must never read as a pass, and it must never be what blocks.
#
# WHY docker run AND NOT container:. Running the job inside an old image would
# be simpler to read and would not work: actions/checkout needs a node the
# glibc in ubuntu 16.04, 18.04 and 20.04 cannot run. The job runs on the host and
# reaches into containers by hand.
#
# LIMITS, so a green run is not over-read. The receivers are purpose-built
# stand-ins, faithful for what they measure but still stand-ins, and no real
# harness TUI runs here. The call set is gang's, not the test suite's — a
# contributor's checkout is a separate question. The image table below is
# measured rather than assumed: every row was run before it was added, and the
# probes re-read the version at run time so a base image that changes its tmux
# becomes a could-not-determine instead of a silent lie.

on:
  workflow_dispatch:
  push:
    paths:
      - install.sh
      - .github/workflows/tmux-floor.yml
      - .github/workflows/probe-paste-property.sh
      - .github/workflows/probe-vocabulary.sh
  pull_request:
    paths:
      - install.sh
      - .github/workflows/tmux-floor.yml
      - .github/workflows/probe-paste-property.sh
      - .github/workflows/probe-vocabulary.sh

jobs:
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Probe the floor install.sh enforces
        run: |
          set -uo pipefail   # deliberately not -e: every failure path below has a verdict

          S="${GITHUB_STEP_SUMMARY:-/dev/null}"
          say() { printf '%s\n' "$*" | tee -a "$S"; }

          ctd() { # could not determine: loud, annotated, and never a pass — but not a block
            printf '::error::could not determine: %s\n' "$*"
            say ""
            say "### COULD NOT DETERMINE"
            say ""
            say "$*"
            say ""
            say "A cell that cannot establish its own controls has reported nothing, not success."
            exit 0
          }

          mm() { # "3.2a" | "2.6" -> "3.2", the same parse install.sh itself does
            local v maj min
            v="$(printf '%s' "$1" | tr -cd '0-9.')"
            maj="${v%%.*}"
            min="${v#*.}"; min="${min%%.*}"
            printf '%s.%s' "$maj" "$min"
          }

          vlt() { # is $1 < $2, comparing major then minor as numbers
            local am an bm bn
            am="${1%%.*}"; an="${1#*.}"; an="${an%%.*}"
            bm="${2%%.*}"; bn="${2#*.}"; bn="${bn%%.*}"
            if [ "$am" -ne "$bm" ]; then [ "$am" -lt "$bm" ]; return; fi
            [ "$an" -lt "$bn" ]
          }

          val() { # $1 = probe output file, $2 = key
            sed -n "s/^$2=//p" "$1" | head -1
          }

          # --- the floor, taken from the comparison that actually refuses ------
          # Not from the die message beside it. A constant near an enforcement is
          # a claim about the enforcement, and the two drift apart quietly; the
          # suite's cross-site check makes the same distinction for the same
          # reason.
          gate="$(grep -E '"\$major" -eq [0-9]+ \] && \[ "\$minor" -ge [0-9]+' install.sh | head -1)"
          [ -n "$gate" ] || ctd "install.sh has no version comparison this cell can read, so there is no floor to test."
          maj="$(printf '%s' "$gate" | grep -oE '"\$major" -eq [0-9]+' | grep -oE '[0-9]+')"
          min="$(printf '%s' "$gate" | grep -oE '"\$minor" -ge [0-9]+' | grep -oE '[0-9]+')"
          [ -n "$maj" ] && [ -n "$min" ] || ctd "install.sh's version comparison parsed to an empty version."
          FLOOR="$maj.$min"

          # --- images that bracket it -----------------------------------------
          # tmux version = image that ships it, one apt-get and no source build.
          # Every row was measured before it was added, and the probe re-reads
          # the version at run time, so a base image that changes its tmux
          # becomes a loud could-not-determine instead of a silent lie. Adding a
          # row means running it first.
          #
          # 2.1 is the interesting row: it is the newest version anything gang
          # calls can be dated to in tmux source (#31), so it is what the floor
          # would be if source dating were sufficient. It is also where the
          # readline half of the paste measurement runs out — ubuntu:16.04 ships
          # bash 4.3, and enable-bracketed-paste arrived in bash 4.4, so that
          # receiver cannot be made to request mode 2004 at all. Expect
          # could-not-determine there, not a verdict, and read that as the reason
          # the floor is 2.6 rather than as a broken cell.
          IMAGES="3.2=ubuntu:22.04 3.0=ubuntu:20.04 2.6=ubuntu:18.04 2.1=ubuntu:16.04"

          at_image=""; below_image=""; below_ver=""
          for row in $IMAGES; do
            v="${row%%=*}"; img="${row#*=}"
            [ "$v" = "$FLOOR" ] && at_image="$img"
            if vlt "$v" "$FLOOR"; then
              if [ -z "$below_ver" ] || vlt "$below_ver" "$v"; then
                below_ver="$v"; below_image="$img"
              fi
            fi
          done
          [ -n "$at_image" ] || ctd "install.sh enforces tmux $FLOOR and no image in this cell's table ships exactly that version. Measure one and add a row."
          [ -n "$below_image" ] || ctd "install.sh enforces tmux $FLOOR and this cell's table has nothing below it, so the floor cannot be tested from underneath."

          say "install.sh enforces **tmux $FLOOR**, read from its own comparison."
          say ""
          say "- at the floor: \`$at_image\` (tmux $FLOOR)"
          say "- below the floor: \`$below_image\` (tmux $below_ver)"

          # --- run the instruments --------------------------------------------
          # Two probes per version, and the floor needs BOTH. The paste property
          # is the one install.sh used to name; the call set is everything gang
          # actually invokes, and a floor that delivers pastes while failing a
          # call gang makes is not a floor.
          probe() { # $1 = image, $2 = probe script, $3 = output file
            docker run --rm -v "$PWD/.github/workflows:/probe:ro" "$1" \
              bash "/probe/$2" > "$3" 2>&1
          }

          verdict() { # $1 = output file, $2 = version the table claims -> protected | unprotected | CTD:<why>
            local obs ctl bwp bwo ewp ewo
            obs="$(val "$1" tmux)"
            [ -n "$obs" ] || { echo "CTD:the probe printed no version at all"; return; }
            [ "$obs" != ABSENT ] || { echo "CTD:$2's image no longer provides tmux"; return; }
            [ "$(mm "$obs")" = "$2" ] || { echo "CTD:the image ships tmux $obs where this table claims $2"; return; }
            ctl="$(val "$1" readline_control)"
            [ "$ctl" = on ] || { echo "CTD:the readline receiver would not request bracketed paste (control=$ctl), so observation 2 measured its own bash"; return; }
            bwp="$(val "$1" brackets_with_p)"; bwo="$(val "$1" brackets_without_p)"
            ewp="$(val "$1" executed_with_p)"; ewo="$(val "$1" executed_without_p)"
            # A run that never happened must not be read as a run that found
            # nothing. The probe says so in its own words and this refuses to
            # translate it into either verdict.
            case "$bwp $bwo $ewp $ewo" in
              *UNKNOWN*|*UNDELIVERED*)
                echo "CTD:an observation could not be made at all — brackets $bwp/$bwo, executed $ewp/$ewo"
                return ;;
            esac
            # The no-flag run is the negative control. If a paste is safe even
            # without -p then nothing observed here can be attributed to -p.
            if [ "$bwo" != no ] || [ "$ewo" != 1 ]; then
              echo "CTD:the no-flag control did not behave like keystrokes (brackets=$bwo executed=$ewo), so -p cannot be credited with anything"
              return
            fi
            [ "$bwp" = yes ] && [ "$ewp" = 0 ] && { echo protected; return; }
            [ "$bwp" = no ] && [ "$ewp" = 1 ] && { echo unprotected; return; }
            echo "CTD:the two instruments disagree — brackets_with_p=$bwp but executed_with_p=$ewp"
          }

          vocab_verdict() { # $1 = output file, $2 = version the table claims -> ok | failed:N | CTD:<why>
            local obs p f
            obs="$(val "$1" tmux)"
            [ -n "$obs" ] || { echo "CTD:the call-set probe printed no version at all"; return; }
            [ "$obs" != ABSENT ] || { echo "CTD:$2's image no longer provides tmux"; return; }
            [ "$(mm "$obs")" = "$2" ] || { echo "CTD:the image ships tmux $obs where this table claims $2"; return; }
            p="$(val "$1" vocab_pass)"; f="$(val "$1" vocab_fail)"
            case "$p" in ''|*[!0-9]*) echo "CTD:the call-set probe printed no pass count"; return ;; esac
            case "$f" in ''|*[!0-9]*) echo "CTD:the call-set probe printed no fail count"; return ;; esac
            # Zero checks run is not zero checks failed.
            [ "$p" -gt 0 ] || { echo "CTD:the call-set probe ran no checks"; return; }
            [ "$f" -eq 0 ] || { echo "failed:$f"; return; }
            echo ok
          }

          probe "$at_image"    probe-paste-property.sh /tmp/at-paste.txt
          probe "$at_image"    probe-vocabulary.sh     /tmp/at-vocab.txt
          probe "$below_image" probe-paste-property.sh /tmp/below-paste.txt
          probe "$below_image" probe-vocabulary.sh     /tmp/below-vocab.txt
          at="$(verdict /tmp/at-paste.txt "$FLOOR")"
          at_vocab="$(vocab_verdict /tmp/at-vocab.txt "$FLOOR")"
          below="$(verdict /tmp/below-paste.txt "$below_ver")"
          below_vocab="$(vocab_verdict /tmp/below-vocab.txt "$below_ver")"

          say ""
          say "| cell | tmux | bracket bytes with \`-p\` | executed with \`-p\` | paste verdict | call set |"
          say "|---|---|---|---|---|---|"
          row() { # $1 = label, $2 = table version, $3 = paste file, $4 = paste verdict, $5 = call-set verdict
            say "| $1 | $(val "$3" tmux) (table: $2) | $(val "$3" brackets_with_p) | $(val "$3" executed_with_p) | ${4%%:*} | $5 |"
          }
          row "at the floor" "$FLOOR" /tmp/at-paste.txt "$at" "$at_vocab"
          row "below the floor" "$below_ver" /tmp/below-paste.txt "$below" "$below_vocab"
          say ""
          for f in /tmp/at-paste.txt /tmp/at-vocab.txt /tmp/below-paste.txt /tmp/below-vocab.txt; do
            echo "--- raw observations, ${f##*/} ---"; cat "$f"
          done

          # --- verdict ---------------------------------------------------------
          # At the floor, could-not-determine is still not a pass, so it does not
          # fall through to the exit-1 branch below and get reported as a failure
          # it did not establish.
          case "$at" in CTD:*) ctd "at the enforced floor, ${at#CTD:}." ;; esac
          case "$at_vocab" in CTD:*) ctd "at the enforced floor, ${at_vocab#CTD:}." ;; esac

          if [ "$at" != protected ] || [ "$at_vocab" != ok ]; then
            printf '::error::tmux %s is the floor install.sh enforces and it did not hold: paste=%s call-set=%s\n' \
              "$FLOOR" "$at" "$at_vocab"
            say "### The enforced floor does not hold"
            say ""
            say "install.sh refuses everything below tmux $FLOOR, and at tmux $FLOOR the paste property came back"
            say "\`$at\` and the call set came back \`$at_vocab\`. A floor is a promise about the version we"
            say "refuse to go below, so this is the one outcome here that stops a merge."
            exit 1
          fi

          # Below the floor, could-not-determine is the expected result rather
          # than a surprise: it is what "we have not executed the set lower" looks
          # like, and it is precisely why the floor sits where it does.
          case "$below" in CTD:*) ctd "below the enforced floor, ${below#CTD:}. The floor stays at $FLOOR until something decides this." ;; esac
          case "$below_vocab" in CTD:*) ctd "below the enforced floor, ${below_vocab#CTD:}." ;; esac

          if [ "$below" = protected ] && [ "$below_vocab" = ok ]; then
            printf '::warning::the enforced tmux floor is higher than the evidence: %s delivers the paste property and the whole call set\n' "$below_ver"
            say "### The floor is higher than the evidence supports"
            say ""
            say "tmux $below_ver, which install.sh refuses, delivered the paste property AND ran every call gang"
            say "makes. That is the full standard the floor claims for itself, met one version lower, so the"
            say "number can follow the evidence down. Moving it stays a separate decision from measuring it —"
            say "see issue #31 for the inventory and #25 for the paste property."
            exit 0
          fi

          say "### The floor is corroborated"
          say ""
          say "tmux $FLOOR delivers the paste property and runs every call gang makes. tmux $below_ver does not:"
          say "paste=\`$below\`, call set=\`$below_vocab\`. That is what install.sh claims, tested from both sides."
          exit 0
