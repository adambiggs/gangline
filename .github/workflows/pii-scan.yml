name: pii-scan

on: [push, pull_request]

# Gangline's self-contained CI backstop runs its reviewed scanner on GNU and BSD
# userlands. Operator-side pre-push scanning is Snubline's
# local responsibility and does not invoke this tracked copy.

jobs:
  scan:
    strategy:
      fail-fast: false   # a macOS flake must not hide a real linux finding
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tools/pii-scan needs real history to git-rev-list

      - name: Resolve bash
        id: bash
        run: |
          set -euo pipefail

          # Resolve the interpreter used by the scanner's shebang.
          interp="$(command -v bash)"
          echo "interpreter: $interp"
          "$interp" --version | head -1

          if [ "${{ runner.os }}" = macOS ]; then
            bv="$("$interp" -c 'printf "%s.%s" "${BASH_VERSINFO[0]}" "${BASH_VERSINFO[1]}"')"
            [ "$bv" = 3.2 ] || {
              echo "this cell resolves bash $bv, so tools/pii-scan's 3.2 parse is not happening" >&2
              exit 1
            }
          fi

          echo "interp=$interp" >> "$GITHUB_OUTPUT"

      - name: Scan the pushed range
        if: github.event_name == 'push'
        env:
          BASH_INTERP: ${{ steps.bash.outputs.interp }}
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          after="${{ github.event.after }}"
          if [ "$after" = "$zero" ]; then
            echo "pii-scan: ref deleted, nothing to scan"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ "$before" = "$zero" ]; then
            # A new ref has no base; the event's commit list is the exact bound.
            count="$(jq '.commits | length' "$GITHUB_EVENT_PATH")"
            "$BASH_INTERP" tools/pii-scan --range -n "$count" "$after"
          else
            "$BASH_INTERP" tools/pii-scan --range "$before..$after"
          fi

      - name: Scan the pull request range
        if: github.event_name == 'pull_request'
        env:
          BASH_INTERP: ${{ steps.bash.outputs.interp }}
        run: >-
          "$BASH_INTERP" tools/pii-scan --range
          ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
