name: commits

on:
  push:
  pull_request:
    # Titles can change without commits, so edited must rerun the title gate.
    types: [opened, edited, reopened, synchronize]

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # Use the same gate as commit-msg; fall back to reachable history when
          # the event has no usable base.
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            range="${BASE}..${HEAD_SHA}"
          else
            range="$HEAD_SHA"
            echo "no usable base ref — checking all history reachable from $HEAD_SHA"
          fi

          fail=0 n=0
          for sha in $(git rev-list "$range"); do
            n=$((n + 1))
            git log -1 --format=%B "$sha" > /tmp/msg
            if ! .githooks/commit-msg /tmp/msg; then
              echo "  ^ $(git log -1 --format='%h by %an' "$sha")"
              fail=$((fail + 1))
            fi
          done

          echo "checked $n commit(s), $fail non-conforming"
          [ "$fail" -eq 0 ]

  # A squash merge uses the PR title as its commit message.
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Conventional PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TITLE" > /tmp/title
          .githooks/commit-msg /tmp/title
