name: offline e2e

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A dispatch and the day's scheduled probe exercise the same moving harness.
# Let the first finish so neither run can disguise the other's teardown.
concurrency:
  group: offline-e2e
  cancel-in-progress: false

jobs:
  claude-code:
    runs-on: ubuntu-latest
    # The complete lane measured 33s locally on 2026-08-15. Twenty minutes
    # bounds a wedged setup too; the lane step has its own smaller ceiling.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and latest Claude Code
        run: |
          set -euo pipefail
          command -v tmux >/dev/null || sudo apt-get install -y tmux
          npm install --global @anthropic-ai/claude-code@latest

      - name: Record the runner and harness
        run: |
          set -euo pipefail
          printf 'runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -a
          node --version
          npm --version
          python3 --version
          tmux -V
          claude --version
          locale

      - name: Offline end-to-end lane
        timeout-minutes: 15
        env:
          # A fresh runner has no legitimate lock holder. Keep this bound below
          # the step ceiling so contention reports its owner instead of being
          # erased by the outer timeout.
          GANG_E2E_LOCK_WAIT: 60
          GANG_E2E_ARTIFACT_DIR: ${{ runner.temp }}/gangline-e2e-artifacts
        run: test/e2e.sh

      - name: Retain failed-lane evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: offline-e2e-diagnostics
          path: ${{ runner.temp }}/gangline-e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7
