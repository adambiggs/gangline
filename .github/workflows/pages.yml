name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp site/index.html site/field.js site/demo.js site/demo.txt _site/
          # Pages caches everything for ten minutes and browsers hold scripts
          # longer, so the script's address carries its content hash: a new
          # field.js is a new URL the moment the page that names it arrives.
          v=$(sha256sum site/field.js | cut -c1-12)
          sed -i "s|src=\"field.js\"|src=\"field.js?v=$v\"|" _site/index.html
          grep -q "field.js?v=$v" _site/index.html
          cp site/demo.gif site/demo-light.gif \
            site/demo.mp4 site/demo-light.mp4 \
            site/demo-poster.jpg site/demo-poster-light.jpg _site/
          # A new replay must not reuse a cached video or poster URL.
          demo_v=$(sha256sum site/demo*.mp4 site/demo-poster*.jpg site/demo.js | sha256sum | cut -c1-12)
          sed -i "s|src=\"demo.js\"|src=\"demo.js?v=$demo_v\"|; s|src=\"demo.mp4\"|src=\"demo.mp4?v=$demo_v\"|; s|poster=\"demo-poster.jpg\"|poster=\"demo-poster.jpg?v=$demo_v\"|" _site/index.html
          grep -Fq "src=\"demo.js?v=$demo_v\"" _site/index.html
          grep -Fq "src=\"demo.mp4?v=$demo_v\"" _site/index.html
          grep -Fq "poster=\"demo-poster.jpg?v=$demo_v\"" _site/index.html
          cp -R site/fonts _site/fonts
          # Install instructions point at the raw GitHub URL on purpose — what you
          # pipe is verifiably the repo file — so no /install copy is published.
          cp site/CNAME _site/CNAME

      # The docs are the repository's Markdown, rendered here and nowhere
      # else, so GitHub and the site read the same text.
      - name: Render the docs
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/docsite"
          "$RUNNER_TEMP/docsite/bin/pip" install --quiet markdown-it-py==4.2.0
          "$RUNNER_TEMP/docsite/bin/python" tools/docsite _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
