name: release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Mandatory gate
        run: test/gate.sh

  release-please:
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

  release-binaries:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install acceptance tools
        run: sudo apt-get update && sudo apt-get install -y tmux python3
      - name: Pre-release acceptance
        run: test/acceptance.sh
      - name: Build release assets
        run: packaging/build-release.sh '${{ needs.release-please.outputs.tag_name }}' dist
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber

  # The team kit for Docker Sandboxes, as a multi-platform image on Docker Hub
  # carrying this release's gang: `sbx run --kit docker.io/adambiggs/gangline`.
  release-kit:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, release-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Stage the kit with the release's gang binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --dir assets --pattern "$TAG-linux-*" --pattern SHA256SUMS
          (cd assets && sha256sum -c --ignore-missing SHA256SUMS)
          packaging/sbx/stage.sh kit "amd64=assets/$TAG-linux-amd64" "arm64=assets/$TAG-linux-arm64"
          echo "version=${TAG#gangline-v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: adambiggs
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: kit
          file: kit/gangline-team.yaml
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/adambiggs/gangline:${{ env.version }}
            docker.io/adambiggs/gangline:latest

  pages:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # One deploy at a time; never cancel one that is mid-publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the site
        run: |
          npm ci --prefix site
          npm run build --prefix site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v5
