name: release

# release-please keeps one open PR against main. Every push here refreshes it
# with the Conventional Commits landed since the last tag; merging it tags the
# release, cuts the GitHub Release, and writes CHANGELOG.md. There is no bespoke
# changelog script in this repo and there must not be one.
#
# Versions live in exactly two places and both are driven from this manifest:
# version.txt (the anchor release-please reads) and the packaging stubs, bumped
# as extra-files in release-please-config.json. Do not add a second mechanism.
#
# The repo had zero tags when this landed. The manifest is anchored at 0.0.1 —
# the version the packaging stubs already claimed and never published — and
# bump-minor-pre-major means the first cut off this history lands at 0.1.0.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # tag, and create the GitHub Release
      pull-requests: write   # maintain the release PR
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
