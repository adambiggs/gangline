name: release

# Release Please owns the release PR, changelog, tag, GitHub Release, and version
# updates declared in release-please-config.json.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # tag, and create the GitHub Release
      pull-requests: write   # maintain the release PR
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
