<meta name="color-scheme" content="dark">
<style>
@font-face{font-family:'Newsreader';src:url('../fonts/newsreader-latin.woff2') format('woff2');font-weight:200 800}

html,body{margin:0}
body{width:1280px;height:640px;overflow:hidden;position:relative;color:var(--ink);font-family:'Instrument Sans',sans-serif;text-shadow:0 1px 2px rgba(0,0,0,.45);-webkit-font-smoothing:antialiased}

.t{position:absolute;left:88px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
h1{margin:0;font:500 132px/1 'Newsreader',serif;letter-spacing:-.015em}
.entry{margin:14px 0 0;color:var(--mute);font-size:26px}
.entry span{font-family:'JetBrains Mono',monospace;font-size:24px}
.st{margin:32px 0 0;max-width:540px;font:400 36px/1.3 'Newsreader',serif;text-wrap:balance}
.u{position:absolute;left:88px;bottom:56px;font:500 24px 'Instrument Sans',sans-serif;letter-spacing:.01em;color:var(--mute)}
.term{position:absolute;left:676px;top:128px;width:720px;border:1px solid rgba(255,255,255,.11);background:#05090f;box-shadow:0 28px 56px -20px rgba(0,0,0,.7)}
.term img{display:block;width:100%;height:auto}
.u b{font-weight:500;color:var(--soft)}
</style>
